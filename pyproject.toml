[project]
name = "pest-detection-robot"
version = "0.2.0"
description = "Raspberry Pi software for the pest detection robot"
readme = "README.md"
requires-python = ">=3.10"
# Small packages with ready-made builds for the Pi (from piwheels or apt).
# Model runtimes are optional extras: on a 32-bit Pi they may not install at all,
# and the robot then sends frames to the server for detection instead.
dependencies = [
    "numpy>=1.21",
    "pillow>=9.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Local detection with a .tflite model (needs a tflite-runtime build for your Pi/Python).
tflite = ["tflite-runtime>=2.11"]
# Local detection with an .onnx model (onnxruntime publishes no 32-bit ARM builds).
onnx = ["onnxruntime>=1.16"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
